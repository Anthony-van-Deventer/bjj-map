id: side-control-kimura
name: Kimura from Side Control
type: submission
from: side-control
side: top
percentage: high
summary: Isolate the far arm, lock the figure four and rotate.
steps:
  - Pin the far wrist to the mat
  - Figure-four grip, then step over the head
  - Elbow close to their body, rotate the hand behind their back
counters:
  - name: Grab your own belt or leg
    note: Defend and turn into them.
