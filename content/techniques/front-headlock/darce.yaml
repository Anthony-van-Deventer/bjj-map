id: darce
name: D'Arce Choke
type: submission
from: front-headlock
side: top
percentage: high
summary: Arm under their arm and around the neck, lock and squeeze.
steps:
  - Thread your arm under their far armpit and around the neck
  - Lock with your other arm (figure four)
  - Walk to the side and squeeze
counters:
  - name: Elbow down
    note: Keep your elbow tight to your body.
