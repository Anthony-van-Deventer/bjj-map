id: arm-triangle
name: Arm Triangle
type: submission
from: mount
side: top
percentage: high
summary: Trap their head and arm, move to the side and squeeze.
steps:
  - Push their arm across their face
  - Head in, lock your hands
  - Step off to the side and squeeze
counters:
  - name: Elbow to your own ear
    note: Turn into them and get your elbow out.
