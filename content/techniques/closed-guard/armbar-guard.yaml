id: armbar-guard
name: Armbar from Guard
type: submission
from: closed-guard
side: bottom
percentage: high
summary: Isolate an arm, swing your hips out and hyperextend the elbow.
steps:
  - Control the arm and break posture
  - Foot on the hip, then cut an angle
  - Swing your leg over the face, pinch your knees, and lift your hips
counters:
  - name: Stack and pull the elbow
    note: Drive forward and rotate your thumb down toward the mat.
